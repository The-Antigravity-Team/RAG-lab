[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hyeonproject", email = "axzswq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pypdf>=6.20.0",
    "reportlab>=5.0.1",
]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
